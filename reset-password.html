<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — Nextralis</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/reset-password.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="animated-bg" aria-hidden="true"></div>

  <main class="rp-container" role="main">
    <section class="rp-card" aria-labelledby="reset-title">
      <h1 id="reset-title">Reset your password</h1>
      <p class="sub">Choose a strong new password for your account.</p>

      <form id="resetForm" novalidate>
        <label for="password" class="sr-only">New password</label>
        <div class="input-group">
          <input id="password" name="password" type="password" placeholder="New password" required autocomplete="new-password" aria-label="New password" />
          <button type="button" class="eye-toggle" data-target="password" aria-label="Toggle password visibility">👁️</button>
        </div>

        <label for="confirm" class="sr-only">Confirm password</label>
        <div class="input-group">
          <input id="confirm" name="confirm" type="password" placeholder="Confirm password" required autocomplete="new-password" aria-label="Confirm password" />
          <button type="button" class="eye-toggle" data-target="confirm" aria-label="Toggle password visibility">👁️</button>
        </div>

        <div class="strength-wrapper">
          <div id="strengthBar" class="strength-bar" aria-hidden="true"></div>
          <div id="strengthText" class="strength-text" aria-live="polite"></div>
        </div>

        <button id="resetBtn" class="btn btn-primary" type="submit">
          <span class="btn-text">Reset Password</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div id="rp-message" class="animated-message" aria-live="polite"></div>
    </section>
  </main>

  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="overlay" class="overlay hidden" aria-hidden="true"></div>

  <script src="js/config.js" defer></script>
  <script src="js/reset-password.js" defer></script>
</body>
</html>
