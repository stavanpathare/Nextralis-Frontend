<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password — Nextralis</title>
  <link rel="icon" type="image/png" href="/Icons/forgot-password.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forgot-password.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/premium.css">
</head>
<body>
  <div class="animated-bg" aria-hidden="true"></div>

  <main class="fp-container" role="main">
    <section class="fp-card" aria-labelledby="forgot-title">
      <h1 id="forgot-title">Forgot your password?</h1>
      <p class="sub">Enter your account email and we'll send a secure reset link.</p>

      <form id="forgotForm" novalidate>
        <label for="email" class="sr-only">Email</label>
        <div class="input-group">
          <input id="email" name="email" type="email" placeholder="you@company.com" required autocomplete="email" aria-label="Email address" />
        </div>

        <button id="sendBtn" class="btn btn-primary" type="submit">
          <span class="btn-text">Send Reset Link</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div id="fp-message" class="animated-message" aria-live="polite"></div>
    </section>
  </main>

  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="overlay" class="overlay hidden" aria-hidden="true"></div>

  <script src="js/config.js" defer></script>
  <script src="js/forgot-password.js" defer></script>
</body>
</html>
