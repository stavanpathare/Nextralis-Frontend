<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Nextralis</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/subscription.css" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/theme.css" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <main class="checkout-container">
      <a class="checkout-back" href="subscription.html">← Back to subscription</a>
      <section class="checkout-card">
        <h1>Secure checkout</h1>
        <p>One-time payment. This does not create an automatic recurring mandate.</p>
        <div class="checkout-summary" id="checkout-summary" aria-live="polite">Loading selected plan…</div>
        <div class="checkout-customer" id="checkout-customer"></div>
        <p class="checkout-origin-note" id="checkout-origin-note" role="status" hidden></p>
        <p class="subscription-error" id="checkout-error" role="alert" hidden></p>
        <button class="btn btn-primary" id="pay-button" type="button" disabled>Continue to payment</button>
        <p class="checkout-note">Your plan activates only after Nextralis verifies the captured payment with Razorpay.</p>
      </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
